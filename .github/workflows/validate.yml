name: Shaderpack structural and GLSL validation

on:
  push:
    branches: [main]
    paths:
      - 'shaders/**'
      - 'tools/**'
      - 'pack.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'shaders/**'
      - 'tools/**'
      - 'pack.json'
      - '.github/workflows/**'
  workflow_dispatch:

# Keep only the newest validation run for a branch. Rapid source commits
# should not leave dozens of obsolete full-pack checks running concurrently.
concurrency:
  group: shader-validation-v2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Compile vertex and fragment shaders
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          while IFS= read -r -d '' shader; do
            case "$shader" in
              *.vsh) stage=vert; ext=vert ;;
              *.fsh) stage=frag; ext=frag ;;
              *) continue ;;
            esac
            expanded="$tmpdir/$(printf '%s' "$shader" | sed 's#[^A-Za-z0-9_]#_#g').$ext"
            echo "Expanding includes and compiling $shader"
            python tools/expand_glsl_includes.py "$shader" "$expanded"
            # Iris exposes these render-target formats to shader sources. They
            # are OpenGL enum constants, not built-in GLSL identifiers; define
            # their numeric values only in this standalone validator copy.
            if grep -Eq '\\b(RGBA16F|RGBA8|RGB16F|R16F|RG16F|RGB8|R8|RG8)\\b' "$expanded"; then
              sed -i '2i#define RGBA16F 34842\n#define RGBA8 32856\n#define RGB16F 34843\n#define R16F 33325\n#define RG16F 33327\n#define RGB8 32849\n#define R8 33321\n#define RG8 33323' "$expanded"
            fi
            glslangValidator -S "$stage" "$expanded"
          done < <(find shaders -type f \( -name '*.vsh' -o -name '*.fsh' \) -print0)
      - name: Compile Iris render-stage macro branches
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          {
            head -n 1 shaders/gbuffers_skybasic.fsh
            printf '%s\n' \
              '#define MC_RENDER_STAGE_SKY 1' \
              '#define MC_RENDER_STAGE_SUNSET 2' \
              '#define MC_RENDER_STAGE_STARS 3' \
              '#define MC_RENDER_STAGE_VOID 4'
            tail -n +2 shaders/gbuffers_skybasic.fsh
          } > "$tmpdir/skybasic.frag"

          {
            head -n 1 shaders/gbuffers_skytextured.fsh
            printf '%s\n' \
              '#define MC_RENDER_STAGE_SUN 5' \
              '#define MC_RENDER_STAGE_MOON 6'
            tail -n +2 shaders/gbuffers_skytextured.fsh
          } > "$tmpdir/skytextured.frag"

          {
            head -n 1 shaders/gbuffers_line.fsh
            printf '%s\n' \
              '#define MC_RENDER_STAGE_OUTLINE 7' \
              '#define MC_RENDER_STAGE_DEBUG 8'
            tail -n +2 shaders/gbuffers_line.fsh
          } > "$tmpdir/line.frag"

          for name in skybasic skytextured line; do
            python tools/expand_glsl_includes.py "$tmpdir/$name.frag" "$tmpdir/$name.expanded.frag"
            glslangValidator -S frag "$tmpdir/$name.expanded.frag"
          done
      - name: Compile LabPBR material branches
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          compile_labpbr_pair() {
            local name="$1"
            local vertex="$2"
            local fragment="$3"
            local vertex_out="$tmpdir/$name.vert"
            local fragment_out="$tmpdir/$name.frag"

            # Inject the Iris format define after #version; preserve the
            # documented at_tangent declaration in the temporary test copy.
            awk 'NR == 1 { print; print "#define MC_TEXTURE_FORMAT_LAB_PBR 1"; next } { print }' "$vertex" > "$vertex_out"
            awk 'NR == 1 { print; print "#define MC_TEXTURE_FORMAT_LAB_PBR 1"; next } { print }' "$fragment" > "$fragment_out"

            local vertex_expanded="$tmpdir/$name.labpbr.expanded.vert"
            local fragment_expanded="$tmpdir/$name.labpbr.expanded.frag"
            python tools/expand_glsl_includes.py "$vertex_out" "$vertex_expanded"
            python tools/expand_glsl_includes.py "$fragment_out" "$fragment_expanded"
            echo "Linking $name LabPBR variant"
            glslangValidator -l "$vertex_expanded" "$fragment_expanded"
          }

          compile_labpbr_pair terrain shaders/gbuffers_terrain.vsh shaders/gbuffers_terrain.fsh
          compile_labpbr_pair water shaders/gbuffers_water.vsh shaders/gbuffers_water.fsh
          compile_labpbr_pair entities shaders/gbuffers_entities.vsh shaders/gbuffers_entities.fsh
          compile_labpbr_pair block_entities shaders/gbuffers_block.vsh shaders/gbuffers_block.fsh
          compile_labpbr_pair hand shaders/gbuffers_hand.vsh shaders/gbuffers_hand.fsh
          compile_labpbr_pair deferred shaders/deferred.vsh shaders/deferred.fsh
      - name: Compile opt-in entity POM branches
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp shaders/gbuffers_entities.vsh "$tmpdir/entities.vert"

          # Compile the non-LabPBR branch with POM enabled.
          sed -e 's/^#define POM_ENTITY_STRENGTH 0.*/#define POM_ENTITY_STRENGTH 20/' \
            -e 's@^//#define ENTITY_GN_AND_CT.*@#define ENTITY_GN_AND_CT@' \
            shaders/gbuffers_entities.fsh > "$tmpdir/entities-pom-oldpbr.frag"
          python tools/expand_glsl_includes.py "$tmpdir/entities.vert" "$tmpdir/entities-pom-oldpbr.expanded.vert"
          python tools/expand_glsl_includes.py "$tmpdir/entities-pom-oldpbr.frag" "$tmpdir/entities-pom-oldpbr.expanded.frag"
          glslangValidator -l "$tmpdir/entities-pom-oldpbr.expanded.vert" "$tmpdir/entities-pom-oldpbr.expanded.frag"

          # Also compile the LabPBR branch with the opt-in POM path enabled.
          awk 'NR == 1 { print; print "#define MC_TEXTURE_FORMAT_LAB_PBR 1"; next }
               /^#define POM_ENTITY_STRENGTH 0/ { print "#define POM_ENTITY_STRENGTH 20"; next }
               /^\/\/#define ENTITY_GN_AND_CT/ { print "#define ENTITY_GN_AND_CT"; next }
               { print }' shaders/gbuffers_entities.fsh > "$tmpdir/entities-pom-labpbr.frag"
          python tools/expand_glsl_includes.py "$tmpdir/entities.vert" "$tmpdir/entities-pom-labpbr.expanded.vert"
          python tools/expand_glsl_includes.py "$tmpdir/entities-pom-labpbr.frag" "$tmpdir/entities-pom-labpbr.expanded.frag"
          glslangValidator -l "$tmpdir/entities-pom-labpbr.expanded.vert" "$tmpdir/entities-pom-labpbr.expanded.frag"
      - name: Compile opt-in Unbound water wave detail
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cp shaders/gbuffers_water.vsh "$tmpdir/water.vert"

          # Compile the fourth very-large normal octave in the oldPBR branch.
          sed 's/^#define WATER_WAVE_DETAIL 0.*/#define WATER_WAVE_DETAIL 1/' \
            shaders/gbuffers_water.fsh > "$tmpdir/water-detail-oldpbr.frag"
          python tools/expand_glsl_includes.py "$tmpdir/water.vert" "$tmpdir/water-detail-oldpbr.expanded.vert"
          python tools/expand_glsl_includes.py "$tmpdir/water-detail-oldpbr.frag" "$tmpdir/water-detail-oldpbr.expanded.frag"
          glslangValidator -l "$tmpdir/water-detail-oldpbr.expanded.vert" "$tmpdir/water-detail-oldpbr.expanded.frag"

          # Compile the same opt-in octave with LabPBR normal-map handling.
          awk 'NR == 1 { print; print "#define MC_TEXTURE_FORMAT_LAB_PBR 1"; next }
               /^#define WATER_WAVE_DETAIL 0/ { print "#define WATER_WAVE_DETAIL 1"; next }
               { print }' shaders/gbuffers_water.fsh > "$tmpdir/water-detail-labpbr.frag"
          python tools/expand_glsl_includes.py "$tmpdir/water.vert" "$tmpdir/water-detail-labpbr.expanded.vert"
          python tools/expand_glsl_includes.py "$tmpdir/water-detail-labpbr.frag" "$tmpdir/water-detail-labpbr.expanded.frag"
          glslangValidator -l "$tmpdir/water-detail-labpbr.expanded.vert" "$tmpdir/water-detail-labpbr.expanded.frag"
      - name: Compile Ultra-Light environment-only reflection branches
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          # Opaque composite: quality zero must compile the environment-only branch.
          sed 's/^#define PBR_REFLECTION_QUALITY 4.*/#define PBR_REFLECTION_QUALITY 0/' \
            shaders/composite.fsh > "$tmpdir/composite-env-only.frag"
          python tools/expand_glsl_includes.py shaders/composite.vsh "$tmpdir/composite-env-only.vert"
          python tools/expand_glsl_includes.py "$tmpdir/composite-env-only.frag" "$tmpdir/composite-env-only.expanded.frag"
          glslangValidator -l "$tmpdir/composite-env-only.vert" "$tmpdir/composite-env-only.expanded.frag"

          # Water: compile the quality-zero environment fallback in both PBR formats.
          cp shaders/gbuffers_water.vsh "$tmpdir/water-env-only.vert"
          sed 's/^#define WATER_REFLECTION_QUALITY 6.*/#define WATER_REFLECTION_QUALITY 0/' \
            shaders/gbuffers_water.fsh > "$tmpdir/water-env-only-oldpbr.frag"
          python tools/expand_glsl_includes.py "$tmpdir/water-env-only.vert" "$tmpdir/water-env-only.expanded.vert"
          python tools/expand_glsl_includes.py "$tmpdir/water-env-only-oldpbr.frag" "$tmpdir/water-env-only-oldpbr.expanded.frag"
          glslangValidator -l "$tmpdir/water-env-only.expanded.vert" "$tmpdir/water-env-only-oldpbr.expanded.frag"

          awk 'NR == 1 { print; print "#define MC_TEXTURE_FORMAT_LAB_PBR 1"; next }
               /^#define WATER_REFLECTION_QUALITY 6/ { print "#define WATER_REFLECTION_QUALITY 0"; next }
               { print }' shaders/gbuffers_water.fsh > "$tmpdir/water-env-only-labpbr.frag"
          python tools/expand_glsl_includes.py "$tmpdir/water-env-only-labpbr.frag" "$tmpdir/water-env-only-labpbr.expanded.frag"
          glslangValidator -l "$tmpdir/water-env-only.expanded.vert" "$tmpdir/water-env-only-labpbr.expanded.frag"

      - name: Inspect water normal alpha-height channel
        shell: bash
        run: |
          set -euo pipefail
          python -c "from PIL import Image" >/dev/null 2>&1 || python -m pip install --quiet --disable-pip-version-check Pillow
          python - <<'PY'
          from PIL import Image

          path = "shaders/lib/textures/water-normal.png"
          image = Image.open(path)
          print(f"Water normal asset: {image.size[0]}x{image.size[1]}, mode={image.mode}, bands={image.getbands()}")
          if "A" in image.getbands() or "transparency" in image.info:
              alpha = image.convert("RGBA").getchannel("A")
              extrema = alpha.getextrema()
              unique_values = len(set(alpha.getdata()))
              print(f"Water normal alpha: min={extrema[0]}, max={extrema[1]}, unique_values={unique_values}")
              if extrema[0] == extrema[1]:
                  print("Alpha is constant; it does not provide a varying height field. Keep water POM disabled.")
              else:
                  print("Alpha varies; verify that it encodes height rather than transparency before enabling water POM.")
          else:
              print("Water normal has no alpha channel; water POM remains unsupported by this asset.")
          PY
      - name: Link vertex and fragment shader programs
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          while IFS= read -r -d '' vertex; do
            fragment="${vertex%.vsh}.fsh"
            if [[ ! -f "$fragment" ]]; then
              echo "Missing fragment stage for $vertex" >&2
              exit 1
            fi
            key="$(printf '%s' "$vertex" | sed 's#[^A-Za-z0-9_]#_#g')"
            python tools/expand_glsl_includes.py "$vertex" "$tmpdir/$key.expanded.vert"
            python tools/expand_glsl_includes.py "$fragment" "$tmpdir/$key.expanded.frag"
            echo "Linking $vertex + $fragment"
            glslangValidator -l "$tmpdir/$key.expanded.vert" "$tmpdir/$key.expanded.frag"
          done < <(find shaders -type f -name '*.vsh' -print0)
      - name: Validate shaderpack structure
        run: python tools/validate_pack.py
