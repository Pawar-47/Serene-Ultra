name: Publish validated alpha shaderpack

on:
  workflow_run:
    workflows: ["Shaderpack structural and GLSL validation"]
    types: [completed]
    branches: [main]
  # Publish a testable alpha automatically after a successful main-branch validation.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish an alpha pre-release from the current main commit"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  publish-alpha:
    if: |
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        )
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Recheck pack structure
        run: python tools/validate_pack.py

      - name: Package shaderpack and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          archive="Serene-Ultra-alpha-${short_sha}.zip"
          zip -X -r "${archive}" shaders pack.json
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload testable shader ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Serene-Ultra-alpha-${{ steps.package.outputs.short_sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
