# Serene Ultra — Iris shader configuration
# Only expose controls that have an implemented rendering effect.

# Main menu
screen = <profile> [QUALITY] [COLOR] *
screen.columns = 2

# Shadow and contact-occlusion controls.
screen.QUALITY = shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF AO_STRENGTH AO_RADIUS MATERIAL_SPECULAR_STRENGTH WATER_FOG_MULT WATER_REFLECTION_QUALITY WATER_REFRACTION_STRENGTH WATER_REFLECTION_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_COLOR_STRENGTH WATER_NOISE_COLOR_STRENGTH WATER_FOAM_STRENGTH WATER_UNDERWATER_STRENGTH GLASS_REFLECTION_STRENGTH PORTAL_EMISSION_STRENGTH WEATHER_TEX_OPACITY WAVING_RAIN PARTICLE_MATERIAL_FEATURES
screen.QUALITY.columns = 2

# Color correction and output look.
screen.COLOR = RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
screen.COLOR.columns = 2

# G-buffer data attachments and overlay validity masks must not blend.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex3=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_particles.colortex3=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_armor_glint.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_skytextured.colortex2=off
blend.gbuffers_skybasic.colortex2=off
blend.gbuffers_line.colortex2=off

# Composite-style passes read main, write alt, then flip by default.
# Keep the scene color on the main attachment for following passes.
flip.deferred.colortex0=true
flip.deferred.colortex3=false
flip.deferred1.colortex0=false
flip.deferred1.colortex4=true

# Half-resolution opaque-scene copy for water refraction and screen-space reflections; deferred1 writes it before translucent gbuffers.
size.buffer.colortex4=0.5 0.5
flip.deferred.colortex4=false
flip.composite.colortex0=true

# Translucent programs preserve their normal source-alpha blend behavior.
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit=off

# Preserve thin translucent texels; shader stages consume Iris alphaTestRef.
# The water threshold matches Complementary Reimagined's working configuration.
alphaTest.gbuffers_damagedblock=GREATER 0.004
alphaTest.gbuffers_water=GREATER 0.0001
alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_spidereyes=GREATER 0.0001
alphaTest.gbuffers_skytextured=GREATER 0.0001
alphaTest.gbuffers_textured=GREATER 0.0001
alphaTest.gbuffers_textured_lit=GREATER 0.01

# Store the emissive scalar in one normalized channel to reduce G-buffer bandwidth.

# Pipeline defaults
particles.ordering=mixed
separateEntityDraws=true
iris.features.optional=ENTITY_TRANSLUCENT
endFlashShadows=true
rain.depth=false
oldLighting=false
underwaterOverlay=true
separateAo=false
vignette=true
sun=true
moon=true
stars=true
sky=true

# Profiles are presets, not feature-removal modes.
profile.Ultra-Light = WATER_REFLECTION_QUALITY:4 shadowMapResolution:512 shadowDistance:96.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:0
profile.Smooth = WATER_REFLECTION_QUALITY:6 shadowMapResolution:1024 shadowDistance:128.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:0
profile.Ultra = WATER_REFLECTION_QUALITY:8 shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:0
profile.HDR = WATER_REFLECTION_QUALITY:8 shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:1
profile.Ultra-HDR = WATER_REFLECTION_QUALITY:8 shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:2

sliders = shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF AO_STRENGTH AO_RADIUS MATERIAL_SPECULAR_STRENGTH WATER_FOG_MULT WATER_REFLECTION_QUALITY WATER_REFRACTION_STRENGTH WATER_REFLECTION_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_COLOR_STRENGTH WATER_NOISE_COLOR_STRENGTH WATER_FOAM_STRENGTH WATER_UNDERWATER_STRENGTH GLASS_REFLECTION_STRENGTH PORTAL_EMISSION_STRENGTH WEATHER_TEX_OPACITY RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
