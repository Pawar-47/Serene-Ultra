# Serene Ultra — Iris shader configuration
# Only expose controls that have an implemented rendering effect.

# Main menu
oldHandLight = false

# Iris-only custom texture for the multi-scale water normal field.
customTexture.waterNormalTex = lib/textures/water-normal.png
screen = <profile> [QUALITY] [COLOR] *
screen.columns = 2

# Shadow and contact-occlusion controls.
screen.QUALITY = LIGHT_SHAFT_STRENGTH LIGHT_SHAFT_QUALITY shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF OPAQUE_NORMAL_MAP_STRENGTH PBR_AO_STRENGTH AO_STRENGTH AO_RADIUS MATERIAL_SPECULAR_STRENGTH PBR_REFLECTION_STRENGTH PBR_REFLECTION_QUALITY POM_STRENGTH POM_ENTITY_STRENGTH ENTITY_GN_AND_CT POM_QUALITY POM_DISTANCE GENERATED_NORMAL_STRENGTH COATED_TEXTURE_STRENGTH MATERIAL_AO_STRENGTH MATERIAL_SSS_STRENGTH RAIN_PUDDLE_STRENGTH MATERIAL_WETNESS_STRENGTH WATER_FOG_MULT WATER_REFLECTION_QUALITY WATER_REFRACTION_STRENGTH WATER_REFLECTION_STRENGTH WATER_NORMAL_MAP_STRENGTH GLASS_NORMAL_MAP_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_WAVE_DETAIL WATER_CAUSTICS_STRENGTH WATER_CAUSTICS_SCALE WATER_COLOR_STRENGTH WATER_NOISE_COLOR_STRENGTH WATER_FOAM_STRENGTH WATER_UNDERWATER_STRENGTH WATER_ABSORPTION_STRENGTH GLASS_REFLECTION_STRENGTH PORTAL_EMISSION_STRENGTH PORTAL_DISTORTION_STRENGTH WEATHER_TEX_OPACITY WAVING_RAIN PARTICLE_MATERIAL_FEATURES HAND_PBR_STRENGTH HELD_LIGHTING_STRENGTH
screen.QUALITY.columns = 2

# Color correction and output look.
screen.COLOR = RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK BLOOM_STRENGTH BLOOM_THRESHOLD FXAA_ENABLED
screen.COLOR.columns = 2

# G-buffer data attachments and overlay validity masks must not blend.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex3=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_particles.colortex3=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_armor_glint.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_skytextured.colortex2=off
blend.gbuffers_skybasic.colortex2=off
blend.gbuffers_line.colortex2=off

# Composite-style passes read main, write alt, then flip by default.
# Keep the scene color on the main attachment for following passes.
flip.deferred.colortex0=true
flip.deferred.colortex3=false
flip.deferred1.colortex0=false
flip.deferred1.colortex4=true

# Half-resolution opaque-scene copy for water refraction and screen-space reflections; deferred1 writes it before translucent gbuffers.
size.buffer.colortex4=0.5 0.5
flip.deferred.colortex4=false
flip.composite.colortex0=true

# Translucent programs preserve their normal source-alpha blend behavior.
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit=off

# Preserve thin translucent texels; shader stages consume Iris alphaTestRef.
# The water threshold matches Complementary Reimagined's working configuration.
alphaTest.gbuffers_damagedblock=GREATER 0.004
alphaTest.gbuffers_water=GREATER 0.0001
alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_spidereyes=GREATER 0.0001
alphaTest.gbuffers_skytextured=GREATER 0.0001
alphaTest.gbuffers_textured=GREATER 0.0001
alphaTest.gbuffers_textured_lit=GREATER 0.01

# colortex3 is RGBA8: emission, reflectance/metal code, material AO, and LabPBR porosity/SSS data.

# Pipeline defaults
particles.ordering=mixed
separateEntityDraws=true
endFlashShadows=true
rain.depth=false
oldLighting=false
underwaterOverlay=true
separateAo=false
vignette=true
sun=true
moon=true
stars=true
sky=true

# Profiles are presets, not feature-removal modes.
profile.Ultra-Light = COATED_TEXTURE_STRENGTH:0 GENERATED_NORMAL_STRENGTH:0 POM_STRENGTH:0 POM_QUALITY:4 POM_DISTANCE:16 POM_ENTITY_STRENGTH:0 RAIN_PUDDLE_STRENGTH:25 MATERIAL_WETNESS_STRENGTH:50 PBR_REFLECTION_STRENGTH:25 PBR_REFLECTION_QUALITY:0 MATERIAL_SPECULAR_STRENGTH:50 MATERIAL_AO_STRENGTH:50 MATERIAL_SSS_STRENGTH:25 PBR_AO_STRENGTH:50 AO_STRENGTH:0.40 AO_RADIUS:0.75 WATER_REFLECTION_QUALITY:0 WATER_REFLECTION_STRENGTH:0.25 WATER_REFRACTION_STRENGTH:0.50 WATER_NORMAL_MAP_STRENGTH:50 WATER_WAVE_STRENGTH:25 WATER_WAVE_DETAIL:0 WATER_WAVE_SPEED:30 WATER_WAVE_SCALE:75 WATER_COLOR_STRENGTH:75 WATER_NOISE_COLOR_STRENGTH:10 WATER_FOAM_STRENGTH:25 WATER_UNDERWATER_STRENGTH:50 WATER_ABSORPTION_STRENGTH:75 WATER_CAUSTICS_STRENGTH:25 WATER_CAUSTICS_SCALE:100 GLASS_NORMAL_MAP_STRENGTH:50 GLASS_REFLECTION_STRENGTH:25 PORTAL_EMISSION_STRENGTH:75 PORTAL_DISTORTION_STRENGTH:25 shadowMapResolution:512 shadowDistance:96.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:0 BLOOM_STRENGTH:0 BLOOM_THRESHOLD:0.90 FXAA_ENABLED:0 HAND_PBR_STRENGTH:0 HELD_LIGHTING_STRENGTH:0 LIGHT_SHAFT_STRENGTH:0 LIGHT_SHAFT_QUALITY:0
profile.Smooth = COATED_TEXTURE_STRENGTH:20 GENERATED_NORMAL_STRENGTH:20 POM_STRENGTH:20 POM_QUALITY:4 POM_DISTANCE:24 POM_ENTITY_STRENGTH:0 RAIN_PUDDLE_STRENGTH:50 MATERIAL_WETNESS_STRENGTH:75 PBR_REFLECTION_STRENGTH:50 PBR_REFLECTION_QUALITY:6 MATERIAL_SPECULAR_STRENGTH:75 MATERIAL_AO_STRENGTH:75 MATERIAL_SSS_STRENGTH:50 PBR_AO_STRENGTH:75 AO_STRENGTH:0.55 AO_RADIUS:1.00 WATER_REFLECTION_QUALITY:6 WATER_REFLECTION_STRENGTH:0.50 WATER_REFRACTION_STRENGTH:0.75 WATER_NORMAL_MAP_STRENGTH:75 WATER_WAVE_STRENGTH:75 WATER_WAVE_DETAIL:0 WATER_WAVE_SPEED:45 WATER_WAVE_SCALE:100 WATER_COLOR_STRENGTH:90 WATER_NOISE_COLOR_STRENGTH:25 WATER_FOAM_STRENGTH:60 WATER_UNDERWATER_STRENGTH:75 WATER_ABSORPTION_STRENGTH:100 WATER_CAUSTICS_STRENGTH:60 WATER_CAUSTICS_SCALE:100 GLASS_NORMAL_MAP_STRENGTH:75 GLASS_REFLECTION_STRENGTH:45 PORTAL_EMISSION_STRENGTH:100 PORTAL_DISTORTION_STRENGTH:75 shadowMapResolution:1024 shadowDistance:128.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:0 BLOOM_STRENGTH:25 BLOOM_THRESHOLD:0.90 FXAA_ENABLED:1 HAND_PBR_STRENGTH:50 HELD_LIGHTING_STRENGTH:50 LIGHT_SHAFT_STRENGTH:20 LIGHT_SHAFT_QUALITY:4
profile.Ultra = COATED_TEXTURE_STRENGTH:35 GENERATED_NORMAL_STRENGTH:35 POM_STRENGTH:35 POM_QUALITY:6 POM_DISTANCE:32 POM_ENTITY_STRENGTH:20 RAIN_PUDDLE_STRENGTH:70 MATERIAL_WETNESS_STRENGTH:100 PBR_REFLECTION_STRENGTH:75 PBR_REFLECTION_QUALITY:8 MATERIAL_SPECULAR_STRENGTH:100 MATERIAL_AO_STRENGTH:100 MATERIAL_SSS_STRENGTH:100 PBR_AO_STRENGTH:100 AO_STRENGTH:0.65 AO_RADIUS:1.25 WATER_REFLECTION_QUALITY:8 WATER_REFLECTION_STRENGTH:0.75 WATER_REFRACTION_STRENGTH:1.00 WATER_NORMAL_MAP_STRENGTH:100 WATER_WAVE_STRENGTH:100 WATER_WAVE_DETAIL:1 WATER_WAVE_SPEED:60 WATER_WAVE_SCALE:100 WATER_COLOR_STRENGTH:100 WATER_NOISE_COLOR_STRENGTH:35 WATER_FOAM_STRENGTH:100 WATER_UNDERWATER_STRENGTH:100 WATER_ABSORPTION_STRENGTH:100 WATER_CAUSTICS_STRENGTH:100 WATER_CAUSTICS_SCALE:100 GLASS_NORMAL_MAP_STRENGTH:100 GLASS_REFLECTION_STRENGTH:60 PORTAL_EMISSION_STRENGTH:100 PORTAL_DISTORTION_STRENGTH:100 shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:0 BLOOM_STRENGTH:50 BLOOM_THRESHOLD:0.90 FXAA_ENABLED:1 HAND_PBR_STRENGTH:100 HELD_LIGHTING_STRENGTH:100 LIGHT_SHAFT_STRENGTH:45 LIGHT_SHAFT_QUALITY:8
profile.HDR = COATED_TEXTURE_STRENGTH:35 GENERATED_NORMAL_STRENGTH:35 POM_STRENGTH:35 POM_QUALITY:6 POM_DISTANCE:32 POM_ENTITY_STRENGTH:20 RAIN_PUDDLE_STRENGTH:70 MATERIAL_WETNESS_STRENGTH:100 PBR_REFLECTION_STRENGTH:75 PBR_REFLECTION_QUALITY:8 MATERIAL_SPECULAR_STRENGTH:100 MATERIAL_AO_STRENGTH:100 MATERIAL_SSS_STRENGTH:100 PBR_AO_STRENGTH:100 AO_STRENGTH:0.65 AO_RADIUS:1.25 WATER_REFLECTION_QUALITY:8 WATER_REFLECTION_STRENGTH:0.75 WATER_REFRACTION_STRENGTH:1.00 WATER_NORMAL_MAP_STRENGTH:100 WATER_WAVE_STRENGTH:100 WATER_WAVE_DETAIL:1 WATER_WAVE_SPEED:60 WATER_WAVE_SCALE:100 WATER_COLOR_STRENGTH:100 WATER_NOISE_COLOR_STRENGTH:35 WATER_FOAM_STRENGTH:100 WATER_UNDERWATER_STRENGTH:100 WATER_ABSORPTION_STRENGTH:100 WATER_CAUSTICS_STRENGTH:100 WATER_CAUSTICS_SCALE:100 GLASS_NORMAL_MAP_STRENGTH:100 GLASS_REFLECTION_STRENGTH:60 PORTAL_EMISSION_STRENGTH:100 PORTAL_DISTORTION_STRENGTH:100 shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:1 BLOOM_STRENGTH:65 BLOOM_THRESHOLD:0.90 FXAA_ENABLED:1 HAND_PBR_STRENGTH:100 HELD_LIGHTING_STRENGTH:100 LIGHT_SHAFT_STRENGTH:50 LIGHT_SHAFT_QUALITY:8
profile.Ultra-HDR = COATED_TEXTURE_STRENGTH:35 GENERATED_NORMAL_STRENGTH:35 POM_STRENGTH:35 POM_QUALITY:6 POM_DISTANCE:32 POM_ENTITY_STRENGTH:20 RAIN_PUDDLE_STRENGTH:70 MATERIAL_WETNESS_STRENGTH:100 PBR_REFLECTION_STRENGTH:75 PBR_REFLECTION_QUALITY:8 MATERIAL_SPECULAR_STRENGTH:100 MATERIAL_AO_STRENGTH:100 MATERIAL_SSS_STRENGTH:100 PBR_AO_STRENGTH:100 AO_STRENGTH:0.65 AO_RADIUS:1.25 WATER_REFLECTION_QUALITY:8 WATER_REFLECTION_STRENGTH:0.75 WATER_REFRACTION_STRENGTH:1.00 WATER_NORMAL_MAP_STRENGTH:100 WATER_WAVE_STRENGTH:100 WATER_WAVE_DETAIL:1 WATER_WAVE_SPEED:60 WATER_WAVE_SCALE:100 WATER_COLOR_STRENGTH:100 WATER_NOISE_COLOR_STRENGTH:35 WATER_FOAM_STRENGTH:100 WATER_UNDERWATER_STRENGTH:100 WATER_ABSORPTION_STRENGTH:100 WATER_CAUSTICS_STRENGTH:100 WATER_CAUSTICS_SCALE:100 GLASS_NORMAL_MAP_STRENGTH:100 GLASS_REFLECTION_STRENGTH:60 PORTAL_EMISSION_STRENGTH:100 PORTAL_DISTORTION_STRENGTH:100 shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:2 BLOOM_STRENGTH:75 BLOOM_THRESHOLD:0.90 FXAA_ENABLED:1 HAND_PBR_STRENGTH:100 HELD_LIGHTING_STRENGTH:100 LIGHT_SHAFT_STRENGTH:60 LIGHT_SHAFT_QUALITY:12

sliders = LIGHT_SHAFT_STRENGTH LIGHT_SHAFT_QUALITY shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF OPAQUE_NORMAL_MAP_STRENGTH PBR_AO_STRENGTH AO_STRENGTH AO_RADIUS MATERIAL_SPECULAR_STRENGTH PBR_REFLECTION_STRENGTH PBR_REFLECTION_QUALITY MATERIAL_AO_STRENGTH MATERIAL_SSS_STRENGTH RAIN_PUDDLE_STRENGTH MATERIAL_WETNESS_STRENGTH WATER_FOG_MULT WATER_REFLECTION_QUALITY WATER_REFRACTION_STRENGTH WATER_REFLECTION_STRENGTH WATER_NORMAL_MAP_STRENGTH GLASS_NORMAL_MAP_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_CAUSTICS_STRENGTH WATER_CAUSTICS_SCALE WATER_COLOR_STRENGTH WATER_NOISE_COLOR_STRENGTH WATER_FOAM_STRENGTH WATER_UNDERWATER_STRENGTH WATER_ABSORPTION_STRENGTH GLASS_REFLECTION_STRENGTH PORTAL_EMISSION_STRENGTH PORTAL_DISTORTION_STRENGTH WEATHER_TEX_OPACITY RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK BLOOM_STRENGTH BLOOM_THRESHOLD FXAA_ENABLED POM_STRENGTH POM_QUALITY POM_DISTANCE GENERATED_NORMAL_STRENGTH COATED_TEXTURE_STRENGTH POM_ENTITY_STRENGTH WATER_WAVE_DETAIL HAND_PBR_STRENGTH HELD_LIGHTING_STRENGTH

# Render translucent terrain into shadowtex0/shadowcolor0 so water can transmit caustic light.
shadowTranslucent=true
flip.shadow.shadowcolor0=false
