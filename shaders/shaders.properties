# Serene Ultra — Iris shader configuration
# Only expose controls that have an implemented rendering effect.

# Main menu
oldHandLight = false

# Iris-only custom texture for the multi-scale water normal field.
customTexture.waterNormalTex = lib/textures/water-normal.png
screen = <profile> [QUALITY] [WATER] [SUN] [SKY] [CLOUDS] [ANTIALIASING] [COLOR] *
screen.columns = 2

# Shadow and contact-occlusion controls.
screen.QUALITY = PBR_REFLECTION_DISTANCE ANISOTROPIC_FILTER_QUALITY AO_TEMPORAL_STRENGTH PBR_REFLECTION_BLUR_STRENGTH SCREEN_GI_TEMPORAL_STRENGTH POM_SLOPE_NORMAL_STRENGTH POM_SELF_SHADOW_STRENGTH WAVING_FOLIAGE_STRENGTH LAVA_WAVE_STRENGTH SPECULAR_AA_STRENGTH MOTION_BLUR_STRENGTH MOTION_BLUR_QUALITY DOF_STRENGTH DOF_FOCUS_DISTANCE DOF_FOCUS_RANGE SCREEN_GI_STRENGTH SCREEN_GI_QUALITY shadowMapResolution shadowDistance SHADOW_FILTER_QUALITY SHADOW_ALPHA_CUTOFF OPAQUE_NORMAL_MAP_STRENGTH PBR_AO_STRENGTH AO_STRENGTH AO_RADIUS MATERIAL_SPECULAR_STRENGTH PBR_REFLECTION_STRENGTH PBR_REFLECTION_QUALITY POM_STRENGTH POM_ENTITY_STRENGTH ENTITY_GN_AND_CT POM_QUALITY POM_DISTANCE GENERATED_NORMAL_STRENGTH COATED_TEXTURE_STRENGTH MATERIAL_AO_STRENGTH MATERIAL_SSS_STRENGTH RAIN_PUDDLE_STRENGTH MATERIAL_WETNESS_STRENGTH PORTAL_EMISSION_STRENGTH PORTAL_DISTORTION_STRENGTH WEATHER_TEX_OPACITY WAVING_RAIN PARTICLE_MATERIAL_FEATURES HAND_PBR_STRENGTH HELD_LIGHTING_STRENGTH EMISSIVE_BOUNCE_STRENGTH
screen.QUALITY.columns = 2

# Sky, atmosphere and dimension-independent weather effects.
screen.WATER = WATER_REFLECTION_DISTANCE WATER_REFLECTION_QUALITY WATER_REFRACTION_STRENGTH WATER_REFLECTION_STRENGTH WATER_NORMAL_MAP_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_WAVE_DETAIL WATER_CAUSTICS_STRENGTH WATER_CAUSTICS_SCALE WATER_COLOR_STRENGTH WATER_NOISE_COLOR_STRENGTH WATER_FOAM_STRENGTH WATER_UNDERWATER_STRENGTH WATER_ABSORPTION_STRENGTH WATER_FOG_MULT UNDERWATER_DISTORTION GLASS_NORMAL_MAP_STRENGTH GLASS_REFLECTION_STRENGTH
screen.WATER.columns = 2
screen.SUN = SUN_SIZE SUN_INTENSITY SUN_GLOW_STRENGTH LENS_FLARE_STRENGTH LIGHT_SHAFT_STRENGTH LIGHT_SHAFT_QUALITY
screen.SUN.columns = 2
screen.SKY = SKY_ATMOSPHERE_STRENGTH SKY_TWILIGHT_STRENGTH AURORA_STRENGTH NEBULA_STRENGTH RAINBOW_STRENGTH FOG_HEIGHT_STRENGTH
screen.SKY.columns = 2
screen.CLOUDS = VOLUMETRIC_CLOUDS VOLUMETRIC_CLOUD_QUALITY CLOUD_SHAPE CLOUD_SIZE CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED CLOUD_SCATTERING_STRENGTH CLOUD_DETAIL_STRENGTH CLOUD_SHADOW_STRENGTH CLOUD_REFLECTION_STRENGTH
screen.CLOUDS.columns = 2

# Temporal and spatial anti-aliasing controls.
screen.ANTIALIASING = TAA_ENABLED TAA_HISTORY_STRENGTH TAA_SHARPEN_STRENGTH FXAA_ENABLED IMAGE_SHARPENING SPECULAR_AA_STRENGTH
screen.ANTIALIASING.columns = 2

# Color correction and output look.
screen.COLOR = BLOOM_QUALITY RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION VIBRANCE TM_WHITE_PATH TM_DARK_DESATURATION HDR_LOOK BLOOM_STRENGTH BLOOM_THRESHOLD CHROMATIC_ABERRATION VIGNETTE_STRENGTH FILM_GRAIN_STRENGTH
screen.COLOR.columns = 2

# Dedicated item G-buffer writes must preserve packed PBR data.

# G-buffer data attachments and overlay validity masks must not blend.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex3=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_particles.colortex3=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_armor_glint.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_skytextured.colortex2=off
blend.gbuffers_skybasic.colortex2=off
blend.gbuffers_line.colortex2=off

# Iris automatically ping-pongs each composite-style pass output listed in
# RENDERTARGETS. Leave output flips at the default; explicit flip directives are
# unnecessary for read-only inputs and can disable or double-flip an output.
# Half-resolution opaque-scene copy for water refraction and screen-space reflections; deferred1 writes it before translucent gbuffers.
size.buffer.colortex4=0.5 0.5

# Two-scale bloom chain. composite1 thresholds the lit scene into a
# half-resolution level, composite2/composite3 run a separable blur over it, and
# composite4 resolves a quarter-resolution wide level. final.fsh combines both.
size.buffer.colortex5=0.5 0.5
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.25 0.25
size.buffer.colortex8=0.125 0.125
size.buffer.colortex9=0.125 0.125
size.buffer.colortex10=0.0625 0.0625
size.buffer.colortex11=0.0625 0.0625

# Translucent programs preserve their normal source-alpha blend behavior.
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit=off

# Preserve thin translucent texels; shader stages consume Iris alphaTestRef.
# The water threshold matches Complementary Reimagined's working configuration.
alphaTest.gbuffers_damagedblock=GREATER 0.004
alphaTest.gbuffers_water=GREATER 0.0001
alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_spidereyes=GREATER 0.0001
alphaTest.gbuffers_skytextured=GREATER 0.0001
alphaTest.gbuffers_textured=GREATER 0.0001
alphaTest.gbuffers_textured_lit=GREATER 0.01

# colortex3 is RGBA8: emission, reflectance/metal code, material AO, and LabPBR porosity/SSS data.

# Pipeline defaults
particles.ordering=mixed
separateEntityDraws=true
endFlashShadows=true
rain.depth=false
oldLighting=false
underwaterOverlay=true
separateAo=false
sun=true
moon=true
stars=true
sky=true
clouds=off

# Profiles are presets, not feature-removal modes.
profile.Ultra-Light = WATER_FOG_MULT:110 SUN_SIZE:100 SUN_INTENSITY:100 SUN_GLOW_STRENGTH:30 SKY_TWILIGHT_STRENGTH:55 CLOUD_SHAPE:0 CLOUD_SIZE:100 TAA_SHARPEN_STRENGTH:0 TAA_HISTORY_STRENGTH:0 TAA_ENABLED:0 WATER_REFLECTION_DISTANCE:16 PBR_REFLECTION_DISTANCE:16 IMAGE_SHARPENING:0 LENS_FLARE_STRENGTH:0 END_NEBULA_STRENGTH:0 NETHER_STORM_STRENGTH:0 RAINBOW_STRENGTH:0 NEBULA_STRENGTH:0 AURORA_STRENGTH:0 ANISOTROPIC_FILTER_QUALITY:1 AO_TEMPORAL_STRENGTH:0 PBR_REFLECTION_BLUR_STRENGTH:0 SCREEN_GI_TEMPORAL_STRENGTH:0 POM_SLOPE_NORMAL_STRENGTH:20 POM_SELF_SHADOW_STRENGTH:25 BLOOM_QUALITY:0 WAVING_FOLIAGE_STRENGTH:20 LAVA_WAVE_STRENGTH:20 SPECULAR_AA_STRENGTH:25 MOTION_BLUR_STRENGTH:0 MOTION_BLUR_QUALITY:0  CHROMATIC_ABERRATION:0 VIGNETTE_STRENGTH:0 FILM_GRAIN_STRENGTH:0  DOF_STRENGTH:0 DOF_FOCUS_DISTANCE:8.0 DOF_FOCUS_RANGE:8.0  SKY_ATMOSPHERE_STRENGTH:65 CLOUD_SCATTERING_STRENGTH:60 COATED_TEXTURE_STRENGTH:0 GENERATED_NORMAL_STRENGTH:0 POM_STRENGTH:0 POM_QUALITY:4 POM_DISTANCE:16 POM_ENTITY_STRENGTH:0 RAIN_PUDDLE_STRENGTH:25 MATERIAL_WETNESS_STRENGTH:50 PBR_REFLECTION_STRENGTH:25 PBR_REFLECTION_QUALITY:0 MATERIAL_SPECULAR_STRENGTH:50 MATERIAL_AO_STRENGTH:50 MATERIAL_SSS_STRENGTH:25 PBR_AO_STRENGTH:50 AO_STRENGTH:0.40 AO_RADIUS:0.75 WATER_REFLECTION_QUALITY:0 WATER_REFLECTION_STRENGTH:0.25 WATER_REFRACTION_STRENGTH:0.25 WATER_NORMAL_MAP_STRENGTH:50 WATER_WAVE_STRENGTH:25 WATER_WAVE_DETAIL:0 WATER_WAVE_SPEED:30 WATER_WAVE_SCALE:75 WATER_COLOR_STRENGTH:75 WATER_NOISE_COLOR_STRENGTH:5 WATER_FOAM_STRENGTH:25 WATER_UNDERWATER_STRENGTH:50 UNDERWATER_DISTORTION:20 WATER_ABSORPTION_STRENGTH:90 WATER_CAUSTICS_STRENGTH:25 WATER_CAUSTICS_SCALE:100 GLASS_NORMAL_MAP_STRENGTH:50 GLASS_REFLECTION_STRENGTH:25 PORTAL_EMISSION_STRENGTH:75 PORTAL_DISTORTION_STRENGTH:25 shadowMapResolution:512 shadowDistance:96.0 SHADOW_ALPHA_CUTOFF:0.10 VIBRANCE:100 TM_WHITE_PATH:100 TM_DARK_DESATURATION:25 HDR_LOOK:0 BLOOM_STRENGTH:0 BLOOM_THRESHOLD:0.90 FXAA_ENABLED:1 HAND_PBR_STRENGTH:0 HELD_LIGHTING_STR