# Serene Ultra — Iris shader configuration
# Effects remain part of the Ultra target. Quality controls are introduced only
# after their implementations and visual/performance validation exist.

# Core pipeline
oldLighting=false
underwaterOverlay=true
separateAo=true
vignette=true
sun=true
moon=true
stars=true
sky=true
# Do not disable vanilla clouds before the custom cloud renderer is implemented.

# Shadow pipeline (first implementation is a depth-only foundation).
shadowMapResolution=1024
shadowDistance=96.0
shadowIntervalSize=2.0
shadowHardwareFiltering=true
shadowtex0=true
shadowtex1=false
shadowcolor0=false

# Keep the initial pack conservative on older Intel drivers.
# Additional render targets and passes will be enabled as their implementations land.
