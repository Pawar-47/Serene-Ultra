# Serene Ultra — Iris shader configuration
# Only expose controls that have an implemented rendering effect.

# Main menu
oldHandLight = false

# Iris-only custom texture for the multi-scale water normal field.
customTexture.waterNormalTex = lib/textures/water-normal.png
screen = <profile> [QUALITY] [COLOR] *
screen.columns = 2

# Shadow and contact-occlusion controls.
screen.QUALITY = SPECULAR_AA_STRENGTH MOTION_BLUR_STRENGTH MOTION_BLUR_QUALITY DOF_STRENGTH DOF_FOCUS_DISTANCE DOF_FOCUS_RANGE SCREEN_GI_STRENGTH SCREEN_GI_QUALITY LIGHT_SHAFT_STRENGTH LIGHT_SHAFT_QUALITY shadowMapResolution shadowDistance SHADOW_FILTER_QUALITY SHADOW_ALPHA_CUTOFF OPAQUE_NORMAL_MAP_STRENGTH PBR_AO_STRENGTH AO_STRENGTH AO_RADIUS MATERIAL_SPECULAR_STRENGTH PBR_REFLECTION_STRENGTH PBR_REFLECTION_QUALITY SKY_ATMOSPHERE_STRENGTH CLOUD_SCATTERING_STRENGTH CLOUD_DETAIL_STRENGTH CLOUD_SHADOW_STRENGTH VOLUMETRIC_CLOUDS VOLUMETRIC_CLOUD_QUALITY CLOUD_ALTITUDE CLOUD_THICKNESS CLOUD_COVERAGE CLOUD_DENSITY CLOUD_SPEED FOG_HEIGHT_STRENGTH POM_STRENGTH POM_ENTITY_STRENGTH ENTITY_GN_AND_CT POM_QUALITY POM_DISTANCE GENERATED_NORMAL_STRENGTH COATED_TEXTURE_STRENGTH MATERIAL_AO_STRENGTH MATERIAL_SSS_STRENGTH RAIN_PUDDLE_STRENGTH MATERIAL_WETNESS_STRENGTH WATER_FOG_MULT WATER_REFLECTION_QUALITY WATER_REFRACTION_STRENGTH WATER_REFLECTION_STRENGTH WATER_NORMAL_MAP_STRENGTH GLASS_NORMAL_MAP_STRENGTH WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE WATER_WAVE_DETAIL WATER_CAUSTICS_STRENGTH WATER_CAUSTICS_SCALE WATER_COLOR_STRENGTH WATER_NOISE_COLOR_STRENGTH WATER_FOAM_STRENGTH WATER_UNDERWATER_STRENGTH WATER_ABSORPTION_STRENGTH GLASS_REFLECTION_STRENGTH PORTAL_EMISSION_STRENGTH PORTAL_DISTORTION_STRENGTH WEATHER_TEX_OPACITY WAVING_RAIN PARTICLE_MATERIAL_FEATURES HAND_PBR_STRENGTH HELD_LIGHTING_STRENGTH
screen.QUALITY.columns = 2

# Color correction and output look.
screen.COLOR = RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK BLOOM_STRENGTH BLOOM_THRESHOLD FXAA_ENABLED CHROMATIC_ABERRATION VIGNETTE_STRENGTH FILM_GRAIN_STRENGTH
screen.COLOR.columns = 2

# Dedicated item G-buffer writes must preserve packed PBR data.

# G-buffer data attachments and overlay validity masks must not blend.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_block.colortex3=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_particles.colortex3=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_armor_glint.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_skytextured.colortex2=off
blend.gbuffers_skybasic.colortex2=off
blend.gbuffers_line.colortex2=off

# Iris automatically ping-pongs each composite-style pass output listed in
# RENDERTARGETS. Leave output flips at the default; explicit flip directives are
# unnecessary for read-only inputs and can disable or double-flip an output.
# Half-resolution opaque-scene copy for water refraction and screen-space reflections; deferred1 writes it before translucent gbuffers.
size.buffer.colortex4=0.5 0.5

# Two-scale bloom chain. composite1 thresholds the lit scene into a
# half-resolution level, composite2/composite3 run a separable blur over it, and
# composite4 resolves a quarter-resolution wide level. final.fsh combines both.
size.buffer.colortex5=0.5 0.5
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.25 0.25

# Translucent programs preserve their normal source-alpha blend behavior.
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit=off

# Preserve thin translucent texels; shader stages consume Iris alphaTestRef.
# The water threshold matches Complementary Reimagined's working configuration.
alphaTest.gbuffers_damagedblock=GREATER 0.004
alphaTest.gbuffers_water=GREATER 0.0001
alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_spidereyes=GREATER 0.0001
alphaTest.gbuffers_skytextured=GREATER 0.0001
alphaTest.gbuffers_textured=GREATER 0.0001
alphaTest.gbuffers_textured_lit=GREATER 0.01

# colortex3 is RGBA8: emission, reflectance/metal code, material AO, and LabPBR porosity/SSS data.

# Pipeline defaults
particles.ordering=mixed
separateEntityDraws=true
endFlashShadows=true
rain.depth=false
oldLighting=false
underwaterOverlay=true
separateAo=false
vignette=false # Serene applies its own adjustable final-pass vignette
sun=true
moon=true
stars=true
sky=true

# Profiles are presets, not feature-removal modes.
