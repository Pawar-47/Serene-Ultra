# Serene Ultra — Iris shader configuration
# Only expose controls that have an implemented rendering effect.

# Main menu
screen = <profile> [QUALITY] [COLOR] *
screen.columns = 2

# Shadow and contact-occlusion controls.
screen.QUALITY = shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF AO_STRENGTH AO_RADIUS WATER_FOG_MULT WEATHER_TEX_OPACITY WAVING_RAIN
screen.QUALITY.columns = 2

# Color correction and output look.
screen.COLOR = RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
screen.COLOR.columns = 2

# Explicitly disable blending for deferred data attachments. Color remains
# unmodified for the opaque/cutout terrain and entity passes.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_armor_glint.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_armor_glint.colortex2=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_skytextured.colortex2=off

# Deferred/composite are composite-style programs: explicitly retain Iris' main/alt
# flip for colortex0. Deferred writes the lit opaque scene to the alternate image;
# translucent gbuffers then blend into the new main image before composite.
flip.deferred.colortex0=true
flip.composite.colortex0=true

# Preserve post-deferred translucent contributions with standard source-alpha
# blending. These dedicated forward programs write scene color only.
blend.gbuffers_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
alphaTest.gbuffers_water=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_spidereyes=GREATER 0.0001
alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001
alphaTest.gbuffers_textured=GREATER 0.0001
blend.gbuffers_weather.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Pipeline defaults
# Iris splits opaque particles before deferred and translucent particles after it.
particles.ordering=mixed
# Align End shadow direction with the current dragon-death flash when present.
endFlashShadows=true
# Keep rain/snow in the post-deferred color path without depth-buffer writes.
rain.depth=false
oldLighting=false
underwaterOverlay=true
separateAo=false
vignette=true
sun=true
moon=true
stars=true
sky=true

# Profiles are presets, not feature-removal modes.
profile.Ultra-Light = shadowMapResolution:512 shadowDistance:96.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:0
profile.Smooth = shadowMapResolution:1024 shadowDistance:128.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:0
profile.Ultra = shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:0
profile.HDR = shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:1
profile.Ultra-HDR = shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 AO_STRENGTH:0.65 AO_RADIUS:1.25 HDR_LOOK:2

sliders = shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF AO_STRENGTH AO_RADIUS WATER_FOG_MULT WEATHER_TEX_OPACITY RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
