# Serene Ultra — Iris shader configuration
# Only expose controls that have an implemented rendering effect.

# Main menu
screen = <profile> [QUALITY] [COLOR] *
screen.columns = 2

# Shadow-map controls and cutout caster behavior.
screen.QUALITY = shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF
screen.QUALITY.columns = 2

# Color correction and output look.
screen.COLOR = RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
screen.COLOR.columns = 2

# Explicitly disable blending for deferred data attachments. Color remains
# unmodified for the opaque/cutout terrain and entity passes.
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off

# Shader pipeline defaults
oldLighting=false
underwaterOverlay=true
separateAo=true
vignette=true
sun=true
moon=true
stars=true
sky=true
shadowIntervalSize=2.0
shadowHardwareFiltering=true

# Profiles are presets, not feature-removal modes.
profile.Ultra-Light = shadowMapResolution:512 shadowDistance:96.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:0
profile.Smooth = shadowMapResolution:1024 shadowDistance:128.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:0
profile.Ultra = shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:0
profile.HDR = shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:1
profile.Ultra-HDR = shadowMapResolution:2048 shadowDistance:224.0 SHADOW_ALPHA_CUTOFF:0.10 HDR_LOOK:2

sliders = shadowMapResolution shadowDistance SHADOW_ALPHA_CUTOFF RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
