# Serene Ultra — Iris shader configuration
# User settings are grouped into sub-screens. Keep this menu organized as
# new implemented features become available; do not expose non-functional toggles.

# Main menu
screen = <profile> [QUALITY] [COLOR] *
screen.columns = 2

# Quality controls exposed as shader constants in shadow.vsh.
screen.QUALITY = shadowMapResolution shadowDistance
screen.QUALITY.columns = 2

# Color correction and output look
screen.COLOR = RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
screen.COLOR.columns = 2

# Shader pipeline defaults
oldLighting=false
underwaterOverlay=true
separateAo=true
vignette=true
sun=true
moon=true
stars=true
sky=true
shadowIntervalSize=2.0
shadowHardwareFiltering=true

# Profiles are presets, not feature-removal modes.
profile.Ultra-Light = shadowMapResolution:512 shadowDistance:96.0 HDR_LOOK:0
profile.Smooth = shadowMapResolution:1024 shadowDistance:128.0 HDR_LOOK:0
profile.Ultra = shadowMapResolution:2048 shadowDistance:224.0 HDR_LOOK:0
profile.HDR = shadowMapResolution:2048 shadowDistance:224.0 HDR_LOOK:1
profile.Ultra-HDR = shadowMapResolution:2048 shadowDistance:224.0 HDR_LOOK:2

# One shared slider declaration for every screen.
sliders = shadowMapResolution shadowDistance RED_GAIN GREEN_GAIN BLUE_GAIN GAMMA EXPOSURE CONTRAST SATURATION HDR_LOOK
